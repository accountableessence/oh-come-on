<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achha Ji Main Haari — a little story for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#171226;
    --navy-2:#241a3a;
    --lavender:#b9a6e0;
    --dusty-blue:#7c93c9;
    --rose:#e7a9c1;
    --rose-deep:#d97fa3;
    --cream:#f4ecdf;
    --brown:#8a6a53;
    --gold:#f2cf8a;
    --ink:#211a2e;
    --panel:rgba(23,18,38,0.82);
    --focus:#f2cf8a;
    --pixel-font:'Press Start 2P', monospace;
    --body-font:'Space Mono', 'Courier New', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy);
    color:var(--cream);
    font-family:var(--body-font);
    min-width:320px;
    overflow-x:hidden;
    -webkit-font-smoothing:none;
    image-rendering:pixelated;
    min-height:100vh;
  }

  #app{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  button{
    font-family:var(--body-font);
    cursor:pointer;
    border:2px solid var(--cream);
    background:var(--ink);
    color:var(--cream);
    padding:10px 16px;
    font-size:14px;
    border-radius:0;
    transition:transform .12s ease, background .12s ease;
  }
  button:hover{background:var(--rose-deep);}
  button:active{transform:scale(0.95);}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }
  button:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---------- TITLE SCREEN ---------- */
  #title-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:32px 20px;
    text-align:center;
    max-width:480px;
    width:100%;
  }
  #title-screen h1{
    font-family:var(--pixel-font);
    font-size:clamp(14px,4vw,20px);
    line-height:1.8;
    color:var(--rose);
    text-shadow:2px 2px 0 var(--ink);
    margin:0;
  }
  #title-screen .subtitle{
    color:var(--lavender);
    font-style:italic;
    font-size:14px;
    margin:0;
  }
  #title-sprites{
    display:flex;
    gap:28px;
    align-items:flex-end;
  }
  canvas#title-canvas{
    image-rendering:pixelated;
  }
  .file-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
    width:100%;
  }
  .file-row label{
    font-size:11px;
    color:var(--dusty-blue);
    letter-spacing:0.5px;
  }
  input[type="file"]{
    font-family:var(--body-font);
    font-size:12px;
    color:var(--cream);
    max-width:280px;
  }
  #start-btn{
    font-family:var(--pixel-font);
    font-size:13px;
    padding:14px 28px;
    background:var(--rose-deep);
    border-color:var(--gold);
  }
  #skip-audio-note{
    font-size:11px;
    color:var(--lavender);
    max-width:320px;
  }

  /* ---------- MAIN EXPERIENCE ---------- */
  #stage{
    position:relative;
    width:100%;
    max-width:520px;
    aspect-ratio:9/16;
    max-height:100vh;
    margin:0 auto;
    overflow:hidden;
    border:0;
  }
  @media (min-width:640px){
    #stage{ border:4px solid var(--ink); max-height:92vh; margin-top:4vh; }
  }
  canvas#scene-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  #dialogue-wrap{
    position:absolute;
    left:0; right:0; bottom:78px;
    display:flex;
    justify-content:center;
    padding:0 14px;
    pointer-events:none;
  }
  #dialogue-wrap.align-you{ justify-content:flex-start; }
  #dialogue-wrap.align-him{ justify-content:flex-end; }
  #dialogue-wrap.align-both{ justify-content:center; }
  #dialogue-box{
    background:var(--panel);
    border:2px solid var(--cream);
    padding:12px 14px;
    max-width:78%;
    width:auto;
    min-width:180px;
    min-height:52px;
    font-size:14px;
    line-height:1.5;
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  #dialogue-box.visible{opacity:1; transform:translateY(0);}
  #dialogue-box.emphasis{
    max-width:480px;
    background:rgba(23,18,38,0.92);
    border-color:var(--gold);
    justify-content:center;
    text-align:center;
  }
  #dialogue-box.emphasis #speaker-tag{display:none;}
  #dialogue-box.emphasis #dialogue-text{
    font-family:var(--pixel-font);
    font-size:clamp(13px,4.2vw,18px);
    line-height:1.9;
    color:var(--gold);
    text-shadow:2px 2px 0 var(--ink);
    width:100%;
  }
    font-family:var(--pixel-font);
    font-size:9px;
    color:var(--gold);
    white-space:nowrap;
    align-self:flex-start;
    margin-top:2px;
  }
  #dialogue-text{flex:1; color:var(--cream);}

  #controls{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:10px 14px 14px;
    background:linear-gradient(to top, rgba(10,7,18,0.9), transparent);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #scrub{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:6px;
    background:var(--ink);
    border:1px solid var(--cream);
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    background:var(--rose);
    border:1px solid var(--cream);
  }
  #scrub::-moz-range-thumb{
    width:14px;height:14px;
    background:var(--rose);
    border:1px solid var(--cream);
  }
  #transport{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  #transport .left-controls{display:flex; gap:8px; align-items:center;}
  #transport button{padding:6px 10px; font-size:16px; line-height:1;}
  #time-label{font-size:11px; color:var(--lavender); white-space:nowrap;}

  #edit-toggle{
    position:absolute;
    top:8px; right:8px;
    z-index:5;
    font-size:10px;
    padding:6px 8px;
    opacity:0.55;
  }

  /* ---------- ENDING ---------- */
  #ending{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    background:rgba(10,7,18,0.88);
    text-align:center;
    padding:24px;
  }
  #ending.visible{display:flex;}
  #ending h2{
    font-family:var(--pixel-font);
    color:var(--rose);
    font-size:18px;
  }
  #ending p{color:var(--lavender); max-width:320px; font-size:13px; line-height:1.6;}

  /* ---------- EDITOR ---------- */
  #editor{
    position:fixed; inset:0;
    background:var(--navy-2);
    color:var(--cream);
    z-index:50;
    display:none;
    overflow-y:auto;
    padding:16px;
  }
  #editor.visible{display:block;}
  #editor h2{font-family:var(--pixel-font); font-size:14px; color:var(--gold);}
  .editor-grid{display:flex; flex-direction:column; gap:14px; max-width:640px; margin:0 auto;}
  .editor-card{border:1px solid var(--dusty-blue); padding:12px;}
  .editor-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px;}
  .editor-row label{font-size:11px; color:var(--lavender); min-width:70px;}
  .editor-row input[type="text"], .editor-row textarea, .editor-row select, .editor-row input[type="number"]{
    font-family:var(--body-font);
    background:var(--ink);
    color:var(--cream);
    border:1px solid var(--dusty-blue);
    padding:6px 8px;
    font-size:13px;
    flex:1;
    min-width:140px;
  }
  .editor-row textarea{min-height:50px; resize:vertical;}
  #scene-list{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;}
  .scene-item{
    display:flex; justify-content:space-between; gap:8px;
    border:1px solid var(--ink); padding:6px 8px; font-size:12px; cursor:pointer;
  }
  .scene-item.active-edit{border-color:var(--gold);}
  .scene-item small{color:var(--dusty-blue);}
  #error-banner{
    background:#5a1f2a;
    border:1px solid var(--rose);
    color:var(--cream);
    padding:8px 10px;
    font-size:12px;
    display:none;
  }
  #error-banner.visible{display:block;}
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>

<div id="app">

  <!-- TITLE SCREEN -->
  <section id="title-screen">
    <h1>♡ A Little Story For You ♡</h1>
    <p class="subtitle">A song, but a little more us.</p>
    <div id="title-sprites">
      <canvas id="title-canvas" width="160" height="120"></canvas>
    </div>
    <div class="file-row" id="file-row" style="display:none;">
      <label for="audio-file">load your copy of the song</label>
      <input type="file" id="audio-file" accept="audio/*">
    </div>
    <button id="start-btn">▶ Start</button>
  </section>

  <!-- MAIN STAGE -->
  <section id="stage" style="display:none;">
    <button id="edit-toggle" title="Timeline editor" style="display:none;">✎ edit</button>
    <canvas id="scene-canvas" aria-hidden="true"></canvas>

    <div id="dialogue-wrap">
      <div id="dialogue-box" role="status" aria-live="polite">
        <span id="speaker-tag"></span>
        <span id="dialogue-text"></span>
      </div>
    </div>

    <div id="controls">
      <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Song progress">
      <div id="transport">
        <div class="left-controls">
          <button id="play-pause" aria-label="Play or pause">▶</button>
          <button id="restart" aria-label="Restart">↻</button>
          <button id="mute" aria-label="Mute or unmute">🔊</button>
        </div>
        <span id="time-label">00:00 / 00:00</span>
      </div>
    </div>

    <div id="ending">
      <h2>♡ THE END ♡</h2>
      <p id="ending-message">Thumbi &amp; Elo — since Nov 12, 2023, and still stealing each other's fries.</p>
      <button id="replay-btn">↻ Play Again</button>
    </div>
  </section>

  <audio id="song" preload="auto" src="assets/song.mp3"></audio>

  <!-- EDITOR -->
  <div id="editor" aria-hidden="true">
    <div class="editor-grid">
      <h2>TIMELINE EDITOR</h2>
      <div id="error-banner"></div>

      <div class="editor-card">
        <div class="editor-row">
          <button id="ed-play">Play</button>
          <button id="ed-pause">Pause</button>
          <button id="ed-restart">Restart</button>
          <span id="ed-current-time">00:00.00</span>
        </div>
        <div class="editor-row">
          <input type="range" id="ed-seek" min="0" max="100" value="0" style="flex:1;">
        </div>
      </div>

      <div class="editor-card">
        <div class="editor-row">
          <button id="set-start">SET START</button>
          <span id="pending-start">start: —</span>
          <button id="set-end">SET END</button>
          <span id="pending-end">end: —</span>
        </div>
        <div class="editor-row">
          <label>Speaker</label>
          <select id="ed-speaker">
            <option value="you">You</option>
            <option value="him">Him</option>
            <option value="both">Both</option>
            <option value="narrator">Narrator</option>
          </select>
        </div>
        <div class="editor-row">
          <label>Dialogue</label>
          <textarea id="ed-dialogue" placeholder="What do they say here?"></textarea>
        </div>
        <div class="editor-row">
          <label>Animation</label>
          <select id="ed-animation">
            <option value="idle">idle</option>
            <option value="happy">happy</option>
            <option value="blushing">blushing</option>
            <option value="angry">angry</option>
            <option value="embarrassed">embarrassed</option>
            <option value="sad">sad</option>
            <option value="surprised">surprised</option>
            <option value="laughing">laughing</option>
            <option value="smug">smug</option>
            <option value="teasing">teasing</option>
            <option value="looking_away">looking_away</option>
            <option value="heart_eyes">heart_eyes</option>
          </select>
        </div>
        <div class="editor-row">
          <label>Background</label>
          <select id="ed-background">
            <option value="night">night sky</option>
            <option value="bedroom">bedroom</option>
            <option value="park">park</option>
            <option value="cafe">café</option>
            <option value="street">street</option>
            <option value="abstract">abstract</option>
          </select>
        </div>
        <div class="editor-row">
          <label>Effect</label>
          <select id="ed-effect">
            <option value="">none</option>
            <option value="stars">stars</option>
            <option value="hearts">hearts</option>
            <option value="petals">petals</option>
            <option value="sparkles">sparkles</option>
            <option value="rain">rain</option>
            <option value="snow">snow</option>
          </select>
        </div>
        <div class="editor-row">
          <button id="save-scene">SAVE SCENE</button>
          <button id="new-scene">＋ ADD SCENE</button>
          <button id="delete-scene">DELETE SCENE</button>
          <button id="preview-scene">▶ PREVIEW</button>
        </div>
      </div>

      <div class="editor-card">
        <div id="scene-list"></div>
      </div>

      <div class="editor-card">
        <div class="editor-row">
          <button id="export-json">EXPORT JSON</button>
          <button id="import-json">IMPORT JSON</button>
          <input type="file" id="import-file" accept="application/json" style="display:none;">
        </div>
        <div class="editor-row">
          <textarea id="json-output" placeholder="Exported JSON appears here" style="min-height:120px; width:100%;"></textarea>
        </div>
      </div>

      <div class="editor-row">
        <button id="close-editor">✕ Close Editor</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============ REDUCED MOTION ============ */
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ PLACEHOLDER SCENE DATA ============
     Timestamps and dialogue below are placeholders (see spec §40).
     Replace them using the built-in editor (✎ edit) once the real
     audio file's timing and the couple's own dialogue are ready. */
  const DEFAULT_SCENES = [
    { id:1,  start:0,     end:4,     speaker:"both", text:"", animation:"looking_away", background:"night", effect:"stars" },
    { id:2,  start:5.71,  end:10.88, speaker:"you",  text:"Okay fine, I'm sorry, don't be dramatic about it — wait, that's my job.", animation:"happy", background:"night", effect:"stars" },
    { id:3,  start:11.01, end:16.11, speaker:"him",  text:"I've seen this act before. Cut it out.", animation:"looking_away", background:"night", effect:"stars" },
    { id:4,  start:16.09, end:21.01, speaker:"you",  text:"Okay fine, I give up. Just don't be mad at me.", animation:"embarrassed", background:"street", effect:"rain" },
    { id:5,  start:21.07, end:26.18, speaker:"him",  text:"Yeah, no. I'll pass.", animation:"smug", background:"street", effect:"rain" },
    { id:6,  start:26.04, end:35.79, speaker:"both", text:"", animation:"teasing", background:"abstract", effect:"sparkles" },
    { id:7,  start:36.14, end:43.98, speaker:"both", text:"", animation:"idle", background:"night", effect:"", youAnim:"teasing", himAnim:"blushing" },
    { id:8,  start:43.91, end:48.7,  speaker:"you",  text:"Why get mad for this small thing??", animation:"sad", background:"abstract", effect:"sparkles" },
    { id:9,  start:48.6,  end:53.1,  speaker:"him",  text:"You were the one giving me silence first. Don't twist it.", animation:"surprised", background:"abstract", effect:"sparkles" },
    { id:10, start:53.8,  end:58.69, speaker:"you",  text:"Take me with you, idiot.", animation:"angry", background:"night", effect:"rain" },
    { id:11, start:58.77, end:63.41, speaker:"him",  text:"No, thank you. I'm fine alone!", animation:"angry", background:"night", effect:"rain" },
    { id:12, start:63.6,  end:65.93, speaker:"you",  text:"Don't break my heart, okay?", animation:"sad", background:"park", effect:"petals" },
    { id:13, start:66.14, end:68.18, speaker:"him",  text:"Let go of my hand, drama queen.", animation:"teasing", background:"park", effect:"petals" },
    { id:14, start:68.46, end:70.86, speaker:"you",  text:"I said, don't break my heart.", animation:"angry", background:"park", effect:"snow" },
    { id:15, start:70.67, end:73.14, speaker:"him",  text:"And I said, let go.", animation:"laughing", background:"park", effect:"snow" },
    { id:16, start:73.2,  end:76.64, speaker:"you",  text:"If I actually let go, you'll be the one begging. Got it?", animation:"smug", background:"bedroom", effect:"hearts" },
    { id:17, start:76.88, end:78.36, speaker:"him",  text:"...got it.", animation:"embarrassed", background:"bedroom", effect:"hearts" },
    { id:18, start:78.5,  end:9999,  speaker:"you",  text:"Okay fine. I give up. Just don't be mad at me.", animation:"heart_eyes", background:"abstract", effect:"hearts", big:true }
  ];

  let scenes = loadScenes();
  function loadScenes(){
    try{
      const raw = localStorage.getItem('pixel-love-scenes');
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(e){ /* storage unavailable — fall back to defaults */ }
    return JSON.parse(JSON.stringify(DEFAULT_SCENES));
  }
  function persistScenes(){
    try{ localStorage.setItem('pixel-love-scenes', JSON.stringify(scenes)); }
    catch(e){ /* private browsing / storage full — silently skip */ }
  }

  /* ============ DOM ============ */
  const titleScreen   = document.getElementById('title-screen');
  const stage          = document.getElementById('stage');
  const audioFileInput = document.getElementById('audio-file');
  const startBtn        = document.getElementById('start-btn');
  const songEl          = document.getElementById('song');
  const canvas          = document.getElementById('scene-canvas');
  const ctx             = canvas.getContext('2d');
  const dialogueWrap     = document.getElementById('dialogue-wrap');
  const dialogueBox      = document.getElementById('dialogue-box');
  const dialogueText     = document.getElementById('dialogue-text');
  const speakerTag       = document.getElementById('speaker-tag');
  const scrub            = document.getElementById('scrub');
  const playPauseBtn     = document.getElementById('play-pause');
  const restartBtn       = document.getElementById('restart');
  const muteBtn          = document.getElementById('mute');
  const timeLabel        = document.getElementById('time-label');
  const endingEl         = document.getElementById('ending');
  const replayBtn        = document.getElementById('replay-btn');
  const editToggle       = document.getElementById('edit-toggle');
  const editor           = document.getElementById('editor');
  const closeEditorBtn   = document.getElementById('close-editor');
  const errorBanner      = document.getElementById('error-banner');

  let audioLoaded = false;
  let hasAudioFile = true;

  /* ============ AUDIO LOADING ============ */
  /* audio file picker removed — song ships as assets/song.mp3 in the repo */

  songEl.addEventListener('error', function(){
    if(hasAudioFile){
      showError("Couldn't load the song. Make sure the file is a valid audio file.");
    }
  });

  /* ============ TITLE SCREEN SPRITES (idle preview) ============ */
  const titleCanvas = document.getElementById('title-canvas');
  const titleCtx = titleCanvas.getContext('2d');
  let titleFrame = 0;
  function drawTitlePreview(){
    titleCtx.clearRect(0,0,titleCanvas.width,titleCanvas.height);
    const bob = prefersReducedMotion ? 0 : Math.sin(titleFrame/24)*3;
    drawCharacter(titleCtx, 44, 70+bob, 3, 'you', 'happy', titleFrame);
    drawCharacter(titleCtx, 100, 70-bob, 3, 'him', 'happy', titleFrame);
    titleFrame++;
    requestAnimationFrame(drawTitlePreview);
  }

  /* ============ PIXEL CHARACTER RENDERER ============
     Simple blocky pixel-art fallback sprites (spec §15/§16).
     Two 12x16 grids drawn as squares; palette differs per character,
     and small overlays encode each emotional state. */
  const PALETTES = {
    you: { hair:'#3b2440', skin:'#f2c9a1', top:'#d97fa3', top2:'#e7a9c1', shoe:'#3b2440' },
    him: { hair:'#241a3a', skin:'#e9b98d', top:'#4a5a8a', top2:'#7c93c9', shoe:'#241a3a' }
  };
  // 1 = hair, 2 = skin, 3 = top primary, 4 = top secondary, 5 = shoe, 0 = empty
  const BASE_SPRITE = [
    "000111100000",
    "001111110000",
    "001222210000",
    "001222210000",
    "000222200000",
    "000333300000",
    "003333330000",
    "003444430000",
    "003444430000",
    "000330033000",
    "000330033000",
    "000330033000",
    "000550055000",
    "000550055000",
    "000000000000",
    "000000000000"
  ];

  function drawCharacter(context, cx, cy, scale, who, state, frame){
    const pal = PALETTES[who];
    const grid = BASE_SPRITE;
    const rows = grid.length, cols = grid[0].length;
    const px = scale;
    const bob = prefersReducedMotion ? 0 : Math.round(Math.sin(frame/14 + (who==='him'?2:0))*(state==='dancing' ? 4 : 1.5));
    const sway = (prefersReducedMotion || state!=='dancing') ? 0 : Math.round(Math.sin(frame/20 + (who==='him'?Math.PI:0))*5);
    const originX = cx - (cols*px)/2 + sway;
    const originY = cy - (rows*px) + bob;

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const v = grid[r][c];
        if(v==='0') continue;
        let color;
        if(v==='1') color = pal.hair;
        else if(v==='2') color = pal.skin;
        else if(v==='3') color = pal.top;
        else if(v==='4') color = pal.top2;
        else if(v==='5') color = pal.shoe;
        context.fillStyle = color;
        context.fillRect(originX + c*px, originY + r*px, px, px);
      }
    }

    /* state overlays */
    context.save();
    if(state==='blushing' || state==='embarrassed' || state==='heart_eyes'){
      context.fillStyle = 'rgba(231,169,193,0.85)';
      context.fillRect(originX + 1*px, originY + 3*px, px, px);
      context.fillRect(originX + 9*px, originY + 3*px, px, px);
    }
    if(state==='angry'){
      context.fillStyle = '#e05a5a';
      context.fillRect(originX + 5*px, originY - 2*px, px, px);
      context.fillRect(originX + 4*px, originY - 3*px, px, px);
      context.fillRect(originX + 6*px, originY - 3*px, px, px);
    }
    if(state==='surprised'){
      context.fillStyle = '#f2cf8a';
      context.fillRect(originX + 5*px, originY - 3*px, px, px*2);
    }
    if(state==='heart_eyes' || state==='happy' || state==='smug' || state==='dancing'){
      if(!prefersReducedMotion){
        const rise = (frame%60)/60;
        context.globalAlpha = 1-rise;
        context.fillStyle = '#e7a9c1';
        context.fillRect(originX + 5*px, originY - (2+rise*6)*px, px, px);
        context.globalAlpha = 1;
      }
    }
    if(state==='sad'){
      context.fillStyle = '#7c93c9';
      context.fillRect(originX + 3*px, originY + 4*px, px/2, px);
      context.fillRect(originX + 9*px, originY + 4*px, px/2, px);
    }
    if(state==='looking_away' || state==='teasing'){
      context.fillStyle = pal.skin;
      context.fillRect(originX + 10*px, originY + 2*px, px, px);
    }
    context.restore();
  }

  /* ============ SCENE BACKGROUND RENDERER ============ */
  const BG_GRADIENTS = {
    night:   ['#171226','#241a3a'],
    bedroom: ['#241a3a','#3a2a4a'],
    park:    ['#1c2a3a','#2f4a3a'],
    cafe:    ['#2a1e2e','#4a3226'],
    street:  ['#151321','#2a2438'],
    abstract:['#100a1c','#241238']
  };

  let particles = [];
  function seedParticles(effect, w, h){
    particles = [];
    if(!effect || prefersReducedMotion) return;
    const count = { stars:40, hearts:10, petals:16, sparkles:24, rain:60, snow:30 }[effect] || 0;
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        s: 1+Math.random()*2,
        v: 0.2+Math.random()*0.6,
        drift: (Math.random()-0.5)*0.4,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  function drawParticles(context, effect, w, h, t){
    if(!effect) return;
    context.save();
    particles.forEach(p=>{
      if(effect==='stars'){
        const tw = 0.5+0.5*Math.sin(t/300+p.phase);
        context.globalAlpha = prefersReducedMotion? 0.7 : tw;
        context.fillStyle = '#f4ecdf';
        context.fillRect(p.x, p.y, p.s, p.s);
      } else if(effect==='hearts'){
        context.globalAlpha = 0.85;
        context.fillStyle = '#e7a9c1';
        context.fillRect(p.x, p.y, p.s*2, p.s*2);
        if(!prefersReducedMotion) p.y -= p.v; 
        if(p.y < -10) p.y = h+10;
      } else if(effect==='petals' || effect==='snow'){
        context.globalAlpha = 0.8;
        context.fillStyle = effect==='petals' ? '#e7a9c1' : '#f4ecdf';
        context.fillRect(p.x, p.y, p.s*1.5, p.s*1.5);
        if(!prefersReducedMotion){ p.y += p.v; p.x += p.drift; }
        if(p.y > h) p.y = -5;
      } else if(effect==='sparkles'){
        context.globalAlpha = 0.4+0.6*Math.abs(Math.sin(t/200+p.phase));
        context.fillStyle = '#f2cf8a';
        context.fillRect(p.x, p.y, p.s, p.s);
      } else if(effect==='rain'){
        context.globalAlpha = 0.5;
        context.strokeStyle = '#7c93c9';
        context.beginPath();
        context.moveTo(p.x,p.y);
        context.lineTo(p.x, p.y+6);
        context.stroke();
        if(!prefersReducedMotion) p.y += p.v*4;
        if(p.y > h) p.y = -10;
      }
    });
    context.restore();
  }

  function drawSceneFeatures(context, background, w, h){
    context.save();
    context.globalAlpha = 0.9;
    if(background==='park'){
      context.fillStyle = '#16241a';
      context.fillRect(0, h*0.78, w, h*0.22);
      context.fillStyle = '#2f4a3a';
      context.fillRect(w*0.1, h*0.4, w*0.08, h*0.4);
    } else if(background==='bedroom'){
      context.fillStyle = '#f2cf8a';
      context.beginPath();
      context.arc(w*0.82, h*0.16, 16, 0, Math.PI*2);
      context.fill();
    } else if(background==='cafe'){
      context.fillStyle = '#3a2a20';
      context.fillRect(w*0.5-30, h*0.7, 60, 8);
    } else if(background==='street'){
      context.fillStyle = '#f2cf8a';
      context.fillRect(w*0.15, h*0.3, 4, 60);
      context.fillRect(w*0.85, h*0.3, 4, 60);
    } else if(background==='night'){
      context.fillStyle = '#f4ecdf';
      context.beginPath();
      context.arc(w*0.78, h*0.18, 14, 0, Math.PI*2);
      context.fill();
    }
    context.restore();
  }

  /* ============ SCENE ENGINE ============ */
  let currentSceneId = null;
  let typewriterTimer = null;

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio||1);
    canvas.height = rect.height * (window.devicePixelRatio||1);
  }

  function getCurrentScene(time){
    if(!scenes.length) return null;
    let match = scenes[0];
    for(let i=0;i<scenes.length;i++){
      if(scenes[i].start <= time) match = scenes[i];
      else break;
    }
    return match;
  }

  function applyScene(scene){
    if(!scene){
      dialogueBox.classList.remove('visible');
      return;
    }
    if(scene.id !== currentSceneId){
      currentSceneId = scene.id;
      seedParticles(scene.effect, canvas.clientWidth||320, canvas.clientHeight||560);
      dialogueBox.classList.toggle('emphasis', !!scene.big);
      dialogueWrap.classList.remove('align-you','align-him','align-both');
      dialogueWrap.classList.add('align-' + (scene.speaker==='you' ? 'you' : scene.speaker==='him' ? 'him' : 'both'));
      typeDialogue(scene.text || '');
      speakerTag.textContent = scene.speaker === 'you' ? 'THUMBI'
        : scene.speaker === 'him' ? 'ELO'
        : scene.speaker === 'both' ? 'BOTH'
        : scene.speaker === 'narrator' ? '' : '';
      const isInstrumental = !scene.text;
      setCharacterState('you', scene.youAnim ? scene.youAnim : (scene.speaker==='you'||scene.speaker==='both' ? (isInstrumental ? 'dancing' : scene.animation) : (isInstrumental ? 'dancing' : 'idle')));
      setCharacterState('him', scene.himAnim ? scene.himAnim : (scene.speaker==='him'||scene.speaker==='both' ? (isInstrumental ? 'dancing' : scene.animation) : (isInstrumental ? 'dancing' : 'idle')));
    }
  }

  const charState = { you:'idle', him:'idle' };
  function setCharacterState(who, state){ charState[who] = state || 'idle'; }

  function typeDialogue(text){
    clearTimeout(typewriterTimer);
    dialogueText.textContent = '';
    if(!text){
      dialogueBox.classList.remove('visible');
      return;
    }
    dialogueBox.classList.add('visible');
    if(prefersReducedMotion){
      dialogueText.textContent = text;
      return;
    }
    let i = 0;
    const speed = 26;
    (function tick(){
      dialogueText.textContent = text.slice(0, i);
      i++;
      if(i <= text.length){
        typewriterTimer = setTimeout(tick, speed);
      }
    })();
  }

  let frame = 0;
  function renderLoop(){
    if(!stage.style.display || stage.style.display === 'none'){ requestAnimationFrame(renderLoop); return; }
    const w = canvas.clientWidth || 320, h = canvas.clientHeight || 560;
    if(canvas.width !== w*(window.devicePixelRatio||1)) resizeCanvas();
    ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
    ctx.clearRect(0,0,w,h);

    const time = isFinite(songEl.currentTime) ? songEl.currentTime : 0;
    const scene = getCurrentScene(time);
    applyScene(scene);

    const bgKey = (scene && scene.background) || 'night';
    const grad = BG_GRADIENTS[bgKey] || BG_GRADIENTS.night;
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, grad[0]);
    g.addColorStop(1, grad[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    drawSceneFeatures(ctx, bgKey, w, h);
    drawParticles(ctx, scene && scene.effect, w, h, frame*16);

    drawCharacter(ctx, w*0.32, h*0.6, Math.max(3, Math.round(w/110)), 'you', charState.you, frame);
    drawCharacter(ctx, w*0.68, h*0.6, Math.max(3, Math.round(w/110)), 'him', charState.him, frame);

    updateTransport();
    frame++;
    requestAnimationFrame(renderLoop);
  }

  function fmtTime(t){
    if(!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function updateTransport(){
    const dur = songEl.duration;
    const cur = songEl.currentTime;
    timeLabel.textContent = fmtTime(cur) + ' / ' + (isFinite(dur) ? fmtTime(dur) : '00:00');
    if(isFinite(dur) && dur > 0 && !scrub.matches(':active')){
      scrub.value = String((cur/dur)*100);
    }
    playPauseBtn.textContent = songEl.paused ? '▶' : '❚❚';
  }

  /* ============ TRANSPORT CONTROLS ============ */
  playPauseBtn.addEventListener('click', function(){
    if(songEl.paused) songEl.play(); else songEl.pause();
  });
  restartBtn.addEventListener('click', function(){
    songEl.currentTime = 0;
    songEl.play();
  });
  let muted = false;
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    songEl.muted = muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });
  scrub.addEventListener('input', function(){
    const dur = songEl.duration;
    if(isFinite(dur) && dur > 0){
      songEl.currentTime = (scrub.value/100) * dur;
    }
  });
  songEl.addEventListener('seeked', function(){
    currentSceneId = null; // force re-apply of scene on seek
  });
  songEl.addEventListener('ended', showEnding);

  function showEnding(){
    endingEl.classList.add('visible');
  }
  replayBtn.addEventListener('click', function(){
    endingEl.classList.remove('visible');
    currentSceneId = null;
    songEl.currentTime = 0;
    songEl.play();
  });

  /* ============ START FLOW ============ */
  startBtn.addEventListener('click', function(){
    if(!hasAudioFile){
      showError('Please choose your song file first.');
      return;
    }
    titleScreen.style.display = 'none';
    stage.style.display = 'block';
    resizeCanvas();
    songEl.play().catch(function(){ /* user gesture already given via click */ });
  });

  window.addEventListener('resize', resizeCanvas);

  /* ============ ERROR HANDLING ============ */
  function showError(msg){
    errorBanner.textContent = msg;
    errorBanner.classList.add('visible');
    clearTimeout(showError._t);
    showError._t = setTimeout(()=>errorBanner.classList.remove('visible'), 4000);
  }
  if(!scenes.length){
    showError('No timeline scenes have been added yet.');
  }

  /* ============ EDITOR ============ */
  const edPlay = document.getElementById('ed-play');
  const edPause = document.getElementById('ed-pause');
  const edRestart = document.getElementById('ed-restart');
  const edCurrentTime = document.getElementById('ed-current-time');
  const edSeek = document.getElementById('ed-seek');
  const setStartBtn = document.getElementById('set-start');
  const setEndBtn = document.getElementById('set-end');
  const pendingStartLbl = document.getElementById('pending-start');
  const pendingEndLbl = document.getElementById('pending-end');
  const edSpeaker = document.getElementById('ed-speaker');
  const edDialogue = document.getElementById('ed-dialogue');
  const edAnimation = document.getElementById('ed-animation');
  const edBackground = document.getElementById('ed-background');
  const edEffect = document.getElementById('ed-effect');
  const saveSceneBtn = document.getElementById('save-scene');
  const newSceneBtn = document.getElementById('new-scene');
  const deleteSceneBtn = document.getElementById('delete-scene');
  const previewSceneBtn = document.getElementById('preview-scene');
  const sceneListEl = document.getElementById('scene-list');
  const exportBtn = document.getElementById('export-json');
  const importBtn = document.getElementById('import-json');
  const importFile = document.getElementById('import-file');
  const jsonOutput = document.getElementById('json-output');

  let pendingStart = null, pendingEnd = null, editingSceneId = null;

  function openEditor(){
    editor.classList.add('visible');
    editor.setAttribute('aria-hidden','false');
    if(!hasAudioFile){
      showError('Load a song on the title screen first so you can time the scenes.');
    }
    renderSceneList();
  }
  function closeEditor(){
    editor.classList.remove('visible');
    editor.setAttribute('aria-hidden','true');
  }
  editToggle.addEventListener('click', openEditor);
  closeEditorBtn.addEventListener('click', closeEditor);

  // allow ?edit=true to open editor automatically, and only then show the button
  try{
    const params = new URLSearchParams(window.location.search);
    if(params.get('edit') === 'true'){
      editToggle.style.display = 'inline-block';
      setTimeout(openEditor, 300);
    }
  }catch(e){}

  edPlay.addEventListener('click', ()=> songEl.play());
  edPause.addEventListener('click', ()=> songEl.pause());
  edRestart.addEventListener('click', ()=>{ songEl.currentTime = 0; });

  edSeek.addEventListener('input', function(){
    const dur = songEl.duration;
    if(isFinite(dur) && dur > 0){
      songEl.currentTime = (edSeek.value/100)*dur;
    }
  });

  function editorTick(){
    const dur = songEl.duration;
    const cur = songEl.currentTime;
    edCurrentTime.textContent = fmtTime(cur) + '.' + String(Math.floor((cur%1)*100)).padStart(2,'0');
    if(isFinite(dur) && dur>0 && !edSeek.matches(':active')){
      edSeek.value = String((cur/dur)*100);
    }
    requestAnimationFrame(editorTick);
  }
  editorTick();

  setStartBtn.addEventListener('click', function(){
    pendingStart = songEl.currentTime || 0;
    pendingStartLbl.textContent = 'start: ' + pendingStart.toFixed(2);
  });
  setEndBtn.addEventListener('click', function(){
    pendingEnd = songEl.currentTime || 0;
    pendingEndLbl.textContent = 'end: ' + pendingEnd.toFixed(2);
  });

  function clearEditorFields(){
    pendingStart = null; pendingEnd = null; editingSceneId = null;
    pendingStartLbl.textContent = 'start: —';
    pendingEndLbl.textContent = 'end: —';
    edDialogue.value = '';
    edSpeaker.value = 'you';
    edAnimation.value = 'idle';
    edBackground.value = 'night';
    edEffect.value = '';
  }

  newSceneBtn.addEventListener('click', clearEditorFields);

  saveSceneBtn.addEventListener('click', function(){
    const start = pendingStart !== null ? pendingStart : 0;
    const end = pendingEnd !== null ? pendingEnd : start + 5;
    if(!isFinite(start) || !isFinite(end) || start === null || end === null){
      showError('Please enter a valid time.');
      return;
    }
    if(end <= start){
      showError('End time must be after start time.');
      return;
    }
    const sceneData = {
      id: editingSceneId || (Date.now()),
      start: Number(start.toFixed(2)),
      end: Number(end.toFixed(2)),
      speaker: edSpeaker.value,
      text: edDialogue.value || '',
      animation: edAnimation.value,
      background: edBackground.value,
      effect: edEffect.value
    };
    if(editingSceneId){
      const idx = scenes.findIndex(s=>s.id===editingSceneId);
      if(idx>-1) scenes[idx] = sceneData;
    } else {
      scenes.push(sceneData);
    }
    scenes.sort((a,b)=>a.start-b.start);
    persistScenes();
    renderSceneList();
    clearEditorFields();
  });

  deleteSceneBtn.addEventListener('click', function(){
    if(!editingSceneId){ showError('Select a scene from the list first.'); return; }
    scenes = scenes.filter(s=>s.id!==editingSceneId);
    persistScenes();
    renderSceneList();
    clearEditorFields();
  });

  previewSceneBtn.addEventListener('click', function(){
    if(pendingStart !== null) songEl.currentTime = pendingStart;
  });

  function renderSceneList(){
    sceneListEl.innerHTML = '';
    if(!scenes.length){
      sceneListEl.innerHTML = '<p style="font-size:12px;color:var(--dusty-blue);">No timeline scenes have been added yet.</p>';
      return;
    }
    scenes.forEach(function(s){
      const row = document.createElement('div');
      row.className = 'scene-item' + (s.id===editingSceneId ? ' active-edit' : '');
      row.innerHTML = '<span>#'+s.id+' — '+fmtTime(s.start)+'–'+fmtTime(s.end)+' ('+s.speaker+')</span><small>'+(s.text||'').slice(0,28)+'</small>';
      row.addEventListener('click', function(){
        editingSceneId = s.id;
        pendingStart = s.start; pendingEnd = s.end;
        pendingStartLbl.textContent = 'start: '+s.start.toFixed(2);
        pendingEndLbl.textContent = 'end: '+s.end.toFixed(2);
        edSpeaker.value = s.speaker;
        edDialogue.value = s.text;
        edAnimation.value = s.animation;
        edBackground.value = s.background || 'night';
        edEffect.value = s.effect || '';
        renderSceneList();
      });
      sceneListEl.appendChild(row);
    });
  }

  exportBtn.addEventListener('click', function(){
    const json = JSON.stringify(scenes, null, 2);
    jsonOutput.value = json;
    try{
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'scenes.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){ /* clipboard/download unavailable — JSON is still shown above */ }
  });

  importBtn.addEventListener('click', ()=> importFile.click());
  importFile.addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const parsed = JSON.parse(reader.result);
        if(Array.isArray(parsed)){
          scenes = parsed;
          persistScenes();
          renderSceneList();
        } else {
          showError('That file does not look like a scene list.');
        }
      }catch(err){
        showError('Could not read that JSON file.');
      }
    };
    reader.readAsText(file);
  });

  /* ============ KICK OFF ============ */
  drawTitlePreview();
  requestAnimationFrame(renderLoop);

})();
</script>
</body>
</html>
